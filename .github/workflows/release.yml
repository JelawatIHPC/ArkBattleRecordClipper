name: release

on:
  workflow_dispatch:          # 手动触发（打包预览，产物名为分支名）
  push:
    tags: ["*"]               # 任意标签（0.1.0 / 0.1.1 / ...）均触发发布

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write        # 创建 GitHub Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.7'
          package-cache: true
          build-cache: true

      - run: xmake f -y -m release
      - run: xmake build -y

      - name: Create Version Directory
        shell: pwsh
        run: |
          xmake install -o staging
          New-Item -ItemType Directory -Path "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME" -Force
          Copy-Item -Path "staging/*" -Destination "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME" -Recurse

      - name: Create Zip
        shell: pwsh
        run: |
          $dir = "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME"
          tar -a -c -f "$dir.zip" -C "release" (Split-Path $dir -Leaf)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: true