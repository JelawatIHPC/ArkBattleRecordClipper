name: release

on:
  workflow_dispatch:          # 手动触发（打包预览，产物名为分支名）
  push:
    tags: ["*"]               # 任意标签（0.1.0 / 0.1.1 / ...）均触发发布

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write        # 创建 GitHub Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.7'
          package-cache: true
          build-cache: true

      - run: xmake f -y -m release
      - run: xmake build -y

      - name: Create Version Directory
        shell: pwsh
        run: |
          xmake install -o staging
          New-Item -ItemType Directory -Path "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME" -Force
          Copy-Item -Path "staging/*" -Destination "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME" -Recurse

      - name: Create Zip
        shell: pwsh
        run: |
          $dir = "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME"
          tar -a -c -f "$dir.zip" -C "release" (Split-Path $dir -Leaf)

      - name: Package PDBs
        shell: pwsh
        run: |
          # 符号文件独立成包 (参考 OBS Studio 的 *-PDBs.zip 实践), 不进安装包;
          # 与 crash.log 中记录的 pdb-guid 配对用于事后解析崩溃栈
          $pdbs = Get-ChildItem -Path build -Recurse -Filter *.pdb |
            Where-Object { $_.Name -notlike "*.obj.pdb" }
          $dst = "release/ArkBattleRecordClipper-$env:GITHUB_REF_NAME-pdbs"
          New-Item -ItemType Directory -Path $dst -Force
          $pdbs | Copy-Item -Destination $dst
          tar -a -c -f "$dst.zip" -C "release" (Split-Path $dst -Leaf)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: true